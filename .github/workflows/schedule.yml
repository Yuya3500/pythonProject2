name: Auto Screening Scheduler

on:
  schedule:
    # UTC時刻で指定（JST-9時間）
    # 4時(JST) ->前日19時(UTC), 6時(JST) ->前日21時(UTC), 14時(JST) ->5時(UTC), 17時(JST) ->8時(UTC)
    - cron: '0 19,21 * * *'
    - cron: '0 5,8 * * *'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Run screening
        run: python batch_screening.py

      - name: Commit and Push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results.csv
          git commit -m "Auto update screening results [skip ci]" || exit 0
          git push