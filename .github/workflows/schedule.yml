name: Auto Screening Scheduler

on:
  schedule:
    - cron: '0 19,21 * * *'
    - cron: '0 5,8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance lxml

      - name: Run screening
        run: python batch_screening.py

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: screening-results
          path: results.csv