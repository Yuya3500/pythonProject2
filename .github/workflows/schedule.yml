name: Auto Screening Scheduler

on:
  schedule:
    - cron: '0 19,21 * * *'
    - cron: '0 5,8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance lxml

      - name: Run screening
        run: python batch_screening.py

      - name: Commit and Push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results.csv
          # 差分がない場合でもエラーで止めず、正常終了させる設定
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update screening results [skip ci]"
          git push origin main || echo "No changes to push"